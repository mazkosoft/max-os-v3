function centerRect(w,h,offset){const tb=taskbarHeight();const mobile=innerWidth<=700;const maxW=innerWidth-(mobile?12:16);const maxH=innerHeight-(tb+(mobile?16:14));const ww=Math.min(w,maxW);const hh=Math.min(h,maxH);return {x:mobile?6:Math.max(8, Math.round((innerWidth-ww)/2)+(offset||0)), y:mobile?8:Math.max(8, Math.round((innerHeight-hh-tb)/2)+(offset||0)), w:ww, h:hh};}
function isFixedWindow(id){return id==='counter'||id==='calendar'||id==='notify'||id==='guestbook';}
function enterSystem(){state.booted=true;state.theme="98";state.start=false;state.windows=[];state.active=null;localStorage.removeItem('maxosx-theme');openStartupWindows();render();ensureCounterScript();preloadWebamp();}
function openStartupWindows(){
  const ids=['notify','calendar','counter','guestbook'];
  const mobile=innerWidth<=700;
  const tb=taskbarHeight();
  const safeRight=mobile?6:10;
  const safeTop=mobile?8:10;
  const maxRight=innerWidth-safeRight;
  const maxBottom=innerHeight-tb-(mobile?6:10);
  let y=safeTop;
  ids.forEach((id,index)=>{
    const app=apps[id];
    const maxW=Math.max(220,innerWidth-(mobile?12:20));
    const ww=Math.min(app.size[0],maxW);
    const mobileH={notify:156,calendar:178,counter:116,guestbook:170};
    const minH=id==='counter'?116:(id==='notify'?156:(id==='calendar'?178:170));
    const targetH=mobile?(mobileH[id]||app.size[1]):app.size[1];
    const hh=Math.min(targetH,Math.max(minH,maxBottom-safeTop));
    const jitterX=mobile?Math.round((Math.random()*10)-5):Math.round((Math.random()*44)-22);
    const jitterY=mobile?Math.round((Math.random()*8)-4):Math.round((Math.random()*16)-8);
    const overlap=mobile?(index===0?0:12+Math.round(Math.random()*8)):(index===0?0:22+Math.round(Math.random()*18));
    let x=maxRight-ww-jitterX;
    if(!mobile && index%2===1)x-=18+Math.round(Math.random()*18);
    x=Math.max(8,Math.min(innerWidth-ww-safeRight,x));
    y=Math.max(safeTop,Math.min(maxBottom-hh,y+jitterY));
    state.windows.push({id,title:app.title,x,y,w:ww,h:hh,z:++state.z,minimized:false,maximized:false,restore:null});
    y=y+hh-overlap;
  });
  state.active='guestbook';
}

function render(){
  applyTheme(state.theme);
  document.documentElement.lang=state.lang==='zh'?'zh-CN':'en';
  if(!state.booted){root.innerHTML=renderBoot();bindBoot();return;}
  const visible = state.windows.filter(w => !w.minimized).map(renderWindow).join("");
  root.innerHTML = '<div class="desktop" id="desktop">' +
    '<div class="icons">' + desktopOrder.map(renderDesktopIcon).join("") + '</div>' +
    visible + renderTaskbar() + (state.start ? renderStartMenu() : '') +
    '</div>';
  bind();
  updateClock();
  syncWebamp();
  syncGuestbook();
  updateCounterDisplay();
}

function renderBoot(){const bars=Array.from({length:22},()=>'<i></i>').join('');return '<div class="boot-screen"><div class="boot-box boot-win98"><div class="boot-logo"><span class="boot-flag"><i></i><i></i><i></i><i></i></span><div><div class="boot-title">MaxOS X</div><div class="boot-sub">Windows 98 compatible mode</div></div></div><div class="boot-panel">Starting MaxOS X...<br>Loading notification, calendar, visitor counter and guestbook.</div><div class="boot-progress">'+bars+'</div><div class="boot-help">&#25353;&#20219;&#24847;&#38190;&#25110;&#28857;&#20987;&#26700;&#38754;&#36827;&#20837;&#31995;&#32479;&#12290;</div><button class="boot-enter" data-boot-enter="1">&#21551;&#21160;</button></div></div>';}
function bindBoot(){const enter=()=>{if(!state.booted)enterSystem();};const btn=document.querySelector('[data-boot-enter]');if(btn)btn.onclick=e=>{e.stopPropagation();enter();};const screen=document.querySelector('.boot-screen');if(screen)screen.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;enter();},{once:true});addEventListener('keydown',enter,{once:true});}

function renderStartMenu(){

function renderWindow(w){
  const maxButton = isFixedWindow(w.id) ? '' : '<button aria-label="Maximize" title="Maximize / Restore" data-max="'+w.id+'"></button>';

function resizeHandles(id){if(isFixedWindow(id))return '';return ['n','s','e','w','ne','nw','se','sw'].map(d=>'<div class="resize-handle resize-'+d+'" data-resize="'+id+':'+d+'"></div>').join('');}
function renderApp(id){
  if(id==='computer')return appComputer();
  if(id==='portfolio')return appPortfolio();
  if(id==='about')return appAbout();
  if(id==='terminal')return appTerminal();
  if(id==='notify')return appNotify();
  if(id==='guestbook')return appGuestbook();
  if(id==='calendar')return appCalendar();
  if(id==='counter')return appCounter();

function appCalendar(){const d=new Date();const y=d.getFullYear(),m=d.getMonth(),today=d.getDate();const first=new Date(y,m,1).getDay();const days=new Date(y,m+1,0).getDate();const week=['SUN','MON','TUE','WED','THU','FRI','SAT'][d.getDay()];let cells='SMTWTFS'.split('').map(x=>'<b>'+x+'</b>').join('');for(let i=0;i<35;i++){const n=i-first+1;cells+='<span class="'+(n===today?'today':'')+'">'+(n>0&&n<=days?n:'')+'</span>';}return '<div class="calendar-app"><div class="calendar-panel"><div class="calendar-head">'+y+' / '+String(m+1).padStart(2,'0')+'</div><div class="calendar">'+cells+'</div></div><div class="calendar-orb"><div><strong>'+String(m+1).padStart(2,'0')+'.'+String(today).padStart(2,'0')+'</strong><small>'+week+'</small></div></div></div>';}


function crtFxNumber(key){return Number(state.crtFx[key] ?? CRTFX_DEFAULT[key] ?? 0);}
function crtFxValue(key){return state.crtFx[key] ?? CRTFX_DEFAULT[key] ?? "";}
function crtFxControl(key,label,min,max,step,unit){
  const v=crtFxValue(key);
  return '<label class="crtfx-control"><span>'+esc(label)+'</span><input type="range" data-crt-param="'+key+'" min="'+min+'" max="'+max+'" step="'+step+'" value="'+esc(v)+'"><output data-crt-value="'+key+'">'+esc(formatCrtFxValue(key,v,unit))+'</output></label>';
}
function crtFxSelect(key,label,options){
  const v=crtFxValue(key);
  return '<label class="crtfx-control"><span>'+esc(label)+'</span><select data-crt-param="'+key+'">'+options.map(o=>'<option value="'+esc(o[0])+'" '+(v===o[0]?'selected':'')+'>'+esc(o[1])+'</option>').join('')+'</select><output data-crt-value="'+key+'">'+esc(v)+'</output></label>';
}
function crtFxDisplayValue(key,value){
  const map={
    warpDirection:{barrel:"\u6876\u5f62",pincushion:"\u6795\u5f62"},
    beamBlend:{add:"\u53e0\u52a0",screen:"\u6ee4\u8272",'color-dodge':"\u989c\u8272\u51cf\u6de1",lighten:"\u53d8\u4eae"}
  };
  return (map[key]&&map[key][value])||String(value);
}
function formatCrtFxValue(key,value,unit){
  if(key==='warpDirection'||key==='beamBlend')return crtFxDisplayValue(key,value);
  if(key==='rgbPeriod'||key==='beamHeight'||key==='maskX'||key==='maskY'||key==='vignetteInner'||key==='vignetteOuter')return String(Math.round(Number(value)))+(unit||'');
  if(key==='beamSpeed')return Number(value).toFixed(1)+(unit||'');
  return Number(value).toFixed(2)+(unit||'');
}

  const brightness=Math.max(.55,Math.min(1.65,Number(cfg.brightness)||1));
  const contrast=Math.max(.65,Math.min(2.1,Number(cfg.contrast)||1));
  const saturation=Math.max(.4,Math.min(2.2,Number(cfg.finalSaturation)||1));
  const pageContrast=(1+(contrast-1)*.34).toFixed(3);
  const bgContrast=(1.06+(contrast-1)*.22).toFixed(3);

  document.body.style.setProperty('--crt-dark-line-alpha',(0.12+mask*.38).toFixed(3));
  document.body.style.setProperty('--crt-light-line-alpha',(0.035+mask*.10).toFixed(3));

let resizeTimer=null;
