      :root {
        --neon-green: #9dff00;
        --glass-top: #369900;
        --glass-center: #ADFF2F;
        --glass-bottom: #e4ff00;
        --crt-scan-bg: repeating-linear-gradient(to bottom, rgba(255,255,255,.16) 0 1px, rgba(0,0,0,.30) 1px 3px), linear-gradient(90deg, rgba(157,255,0,.045), rgba(0,255,80,.016), rgba(0,80,255,.038));
        --crt-scan-size: 100% 3px, 4px 100%;
        --crt-scan-opacity: .44;
        --crt-scan-blend: screen;
      }

      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        background-color: #050505;
        overflow: hidden;
        font-family: 'Source Sans 3', sans-serif;
        position: fixed;
        top: 0;
        left: 0;
      }

      /* Title Font */
      .font-orbitron {
        font-family: 'Orbitron', sans-serif !important;
      }

      /* Use system monospace for terminals */
      .font-mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace !important;
      }

      html, body, #root {
        cursor: url("cursors/3D silver/Tumi_s_3D_Metallic_Normal.gif") 2 2, auto;
      }
      button, a, [data-open], [data-task], [data-media], [data-project], [data-lightbox-src], .cursor-pointer {
        cursor: url("cursors/3D silver/Tumi_s_3D_Metallic_Link.gif") 6 2, pointer !important;
      }
      input, textarea, [contenteditable="true"] {
        cursor: url("cursors/3D silver/Tumi_s_3D_Metallic_Text.gif") 8 14, text !important;
      }
      [data-drag], #taskbar, .cursor-grab, .active\:cursor-grabbing:active {
        cursor: url("cursors/3D silver/Tumi_s_3D_Metallic_Move.gif") 12 12, grab !important;
      }
      [data-resize$=":e"], [data-resize$=":w"], .cursor-e-resize {
        cursor: url("cursors/3D silver/Tumi_s_3D_Metallic_Horizontal.gif") 12 12, ew-resize !important;
      }
      [data-resize$=":n"], [data-resize$=":s"], .cursor-s-resize {
        cursor: url("cursors/3D silver/Tumi_s_3D_Metallic_Vertical.gif") 12 12, ns-resize !important;
      }
      [data-resize$=":ne"], [data-resize$=":sw"], [data-resize$=":nw"], [data-resize$=":se"], .cursor-se-resize {
        cursor: url("cursors/3D silver/Tumi_s_3D_Metallic_Diagonal1.gif") 12 12, nwse-resize !important;
      }
      [disabled], .disabled {
        cursor: url("cursors/3D silver/Tumi_s_3D_Metallic_Unavailable.gif") 12 12, not-allowed !important;
      }
      html.cursor-ready, html.cursor-ready body, html.cursor-ready #root, html.cursor-ready * {
        cursor: none !important;
      }
      .animated-cursor {
        position: fixed;
        left: 0;
        top: 0;
        width: 32px;
        height: 32px;
        z-index: 400000;
        pointer-events: none;
        background: url("cursors/3D silver/Tumi_s_3D_Metallic_Normal.gif") 0 0 / contain no-repeat;
        transform: translate3d(-80px,-80px,0);
        opacity: 1;
        transition: opacity .12s ease;
        will-change: transform;
      }
      .animated-cursor.is-hidden {
        opacity: 0;
      }
      @media (pointer: coarse) {
        html.cursor-ready, html.cursor-ready body, html.cursor-ready #root, html.cursor-ready * {
          cursor: auto !important;
        }
        .animated-cursor {
          display: none;
        }
      }
      .desktop-bg-layer {
        position: absolute;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        overflow: hidden;
        background: #050505 url("backgrounds/green.jpg") center center / cover no-repeat;
        transform: translateZ(0);
        contain: paint;
      }
      .desktop-bg-layer::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 0;
        background: url("backgrounds/green.jpg") center center / cover no-repeat;
      }

      .desktop-bg-video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        max-width: none;
        object-fit: cover;
        opacity: 1;
        filter: none;
        pointer-events: none;
        backface-visibility: hidden;
        transform: translateZ(0);
        will-change: opacity, transform;
      }
      .desktop-bg-layer .desktop-bg-video {
        z-index: 1;
        opacity: 0;
        transition: opacity .36s linear;
      }
      .desktop-bg-layer .desktop-bg-video.is-active {
        opacity: 1;
      }
      .crt-foreground {
        position: fixed;
        inset: 0;
        z-index: 399000;
        pointer-events: none;
        background: var(--crt-scan-bg);
        background-size: var(--crt-scan-size);
        background-position: 0 0, 0 0;
        opacity: var(--crt-scan-opacity);
        mix-blend-mode: var(--crt-scan-blend);
        box-shadow: inset 0 0 8vmax rgba(0,0,0,.24);
        animation: siteCrtScanDrift 3.6s linear infinite, siteCrtBreath 7s ease-in-out infinite, siteCrtGlitch 9s steps(1,end) infinite;
      }
      .crt-foreground::before {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at center, rgba(157,255,0,.045), rgba(157,255,0,0) 62%);
        mix-blend-mode: screen;
        opacity: .68;
      }
      @keyframes siteCrtScanDrift {
        0% { background-position: 0 0, 0 0; }
        100% { background-position: 0 24px, 4px 0; }
      }
            @keyframes siteCrtGlitch {
        0%, 84%, 100% { transform: translate3d(0,0,0); filter:none; opacity:var(--crt-scan-opacity); }
        85% { transform: translate3d(0,1.8px,0); filter:brightness(1.22) contrast(1.34) hue-rotate(3deg); opacity:.78; }
        86% { transform: translate3d(2.2px,-1.2px,0); filter:brightness(.72) contrast(1.52) saturate(1.22); opacity:.92; }
        87% { transform: translate3d(-1.7px,.8px,0); filter:brightness(1.38) contrast(1.22) hue-rotate(-4deg); opacity:.70; }
        88% { transform: translate3d(.9px,0,0); filter:brightness(.84) contrast(1.28); opacity:.82; }
        89% { transform: translate3d(0,0,0); filter:none; opacity:var(--crt-scan-opacity); }
      }
@keyframes siteCrtBreath {
        0%, 100% { opacity: .42; transform: translate3d(0,0,0); }
        49% { opacity: .50; transform: translate3d(0,0,0); }
        51% { opacity: .42; transform: translate3d(0,.18px,0); }
        52% { transform: translate3d(0,0,0); }
      }
      @media (prefers-reduced-motion: reduce) {
        .crt-foreground { animation: none !important; }
      }
      #root {
        position: relative;
        z-index: 1;
      }
      
      .scanlines {
        background: var(--crt-scan-bg);
        background-size: var(--crt-scan-size);
        position: fixed;
        inset: 0;
        z-index: 399000;
        pointer-events: none;
        opacity: var(--crt-scan-opacity);
        mix-blend-mode: var(--crt-scan-blend);
      }

      /* --- Animations --- */
      
      /* CRT Turn On Animation */
      @keyframes crt-turn-on {
        0% {
          transform: scale(1, 0.01) translate3d(0, 0, 0);
          filter: brightness(30);
          opacity: 1;
        }
        50% {
            transform: scale(1, 0.05) translate3d(0, 0, 0);
             filter: brightness(5);
        }
        60% {
          transform: scale(1, 1) translate3d(0, 0, 0);
          filter: brightness(1.5);
          opacity: 1;
        }
        100% {
          transform: scale(1, 1) translate3d(0, 0, 0);
          filter: brightness(1);
          opacity: 1;
        }
      }

      .animate-crt-on {
        animation: crt-turn-on 0.8s cubic-bezier(0.23, 1, 0.32, 1) forwards;
      }
      
      /* CRT Turn Off Animation */
      @keyframes crt-turn-off {
        0% {
            transform: scale(1, 1);
            filter: brightness(1);
            opacity: 1;
        }
        40% {
            transform: scale(1, 0.01);
            filter: brightness(10);
        }
        100% {
            transform: scale(0, 0);
            opacity: 0;
        }
      }

      .animate-crt-off {
          animation: crt-turn-off 0.4s cubic-bezier(0.23, 1, 0.32, 1) forwards;
      }

      /* Stable Glitch (Voltage Drop Simulation) */
      @keyframes stable-glitch {
        0%, 45% { opacity: 1; filter: brightness(1); }
        46% { opacity: 0.6; filter: brightness(0.8); }
        47% { opacity: 1; filter: brightness(1.2); }
        48% { opacity: 1; filter: brightness(1); }
        
        80% { opacity: 1; filter: brightness(1); }
        81% { opacity: 0.2; filter: brightness(0.5); }
        82% { opacity: 1; filter: brightness(1.5); }
        83% { opacity: 1; filter: brightness(1); }
        
        95% { opacity: 1; filter: brightness(1); }
        96% { opacity: 0.7; filter: brightness(0.9); }
        97% { opacity: 1; filter: brightness(1); }
        100% { opacity: 1; filter: brightness(1); }
      }

      .animate-stable-glitch {
        animation: stable-glitch 4s infinite linear; 
      }

      /* WiFi Data Blink (Irregular) */
      @keyframes wifi-activity {
          0%, 100% { color: #444; text-shadow: none; }
          5%, 15% { color: #9dff00; text-shadow: 0 0 8px #9dff00; }
          30% { color: #444; text-shadow: none; }
          35%, 45% { color: #9dff00; text-shadow: 0 0 8px #9dff00; }
          70% { color: #444; text-shadow: none; }
          72%, 75% { color: #9dff00; text-shadow: 0 0 8px #9dff00; }
      }
      
      .animate-wifi-blink {
          animation: wifi-activity 2s infinite steps(1);
      }

/* MAX.OS boot loader */
.boot-screen {
  background:#000;
  overflow:hidden;
}
.boot-screen::before {
  content:"";
  position:absolute;
  inset:0;
  z-index:200001;
  pointer-events:none;
  background:var(--crt-scan-bg);
  background-size:var(--crt-scan-size);
  background-position:0 0, 0 0;
  mix-blend-mode:var(--crt-scan-blend);
  opacity:var(--crt-scan-opacity);
  animation: bootScanDrift 3.6s linear infinite, siteCrtGlitch 9s steps(1,end) infinite;
}
.boot-screen::after {
  content:"";
  position:absolute;
  inset:0;
  z-index:4;
  pointer-events:none;
  background:radial-gradient(ellipse at center, rgba(157,255,0,.035), transparent 42%, rgba(0,0,0,.34) 100%);
  opacity:.75;
}

  0% { background-position:0 0, 0 0; }

}

.boot-cell {
  position:relative;
  overflow:hidden;
  border-radius:4px;

}

  content:"";
  position:absolute;
  left:2px;
  right:2px;
  top:2px;
  height:42%;
  border-radius:999px;
  background:linear-gradient(180deg, rgba(255,255,255,.98), rgba(255,255,255,.18));
  filter:blur(.8px);
  opacity:.92;
}
.boot-cell.is-on::after {
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(90deg, rgba(255,255,255,.18), transparent 38%, rgba(255,255,255,.10));
  mix-blend-mode:screen;
  opacity:.34;

  function postChattableStyle(){
    var frame = document.getElementById("chattable");
    if(!frame || !frame.contentWindow)return;
    try{frame.contentWindow.postMessage(CHATTABLE_MAXOS_CSS,"*");}catch(err){}
  }

  function initChattableGuestbook(){
    var frame = document.getElementById("chattable");
    if(!frame)return;
    if(frame.dataset.chattableBound !== "1"){
      frame.dataset.chattableBound = "1";
      frame.addEventListener("load", function(){
        frame.dataset.chattableFrameLoaded = "1";
        initChattableGuestbook();
        setTimeout(postChattableStyle,80);
        setTimeout(postChattableStyle,520);
        setTimeout(postChattableStyle,1400);
      });
      setTimeout(function(){
        if(frame && frame.dataset.chattableFrameLoaded !== "1"){
          frame.dataset.chattableFrameLoaded = "1";
          initChattableGuestbook();
        }
      },900);
    }
    if(frame.dataset.chattableFrameLoaded !== "1")return;
    if(!window.chattable || typeof window.chattable.initialize !== "function"){
      setTimeout(initChattableGuestbook,250);
      return;
    }
    if(frame.dataset.chattableReady !== "1"){
      frame.dataset.chattableReady = "1";
      window.chattable.initialize({theme:"moderno"});
    }
    postChattableStyle();
    setTimeout(postChattableStyle,320);
    setTimeout(postChattableStyle,1000);
  }

  function widgetState(name){
    if(!S.widgets)S.widgets = {};
    var def = WIDGET_DEFAULTS[name] || {on:true,x:80,y:120,z:20,w:360,h:180};
    var cur = S.widgets[name];
    if(cur == null || typeof cur === "boolean"){
      cur = {on: cur == null ? def.on : cur, x:def.x, y:def.y, z:def.z, w:def.w, h:def.h};
      S.widgets[name] = cur;
    }
    if(cur.x == null)cur.x = def.x; if(cur.y == null)cur.y = def.y; if(cur.z == null)cur.z = def.z; if(cur.w == null)cur.w = def.w; if(cur.h == null)cur.h = def.h; if(cur.on == null)cur.on = true;
    return cur;
  }
  function widgetVisible(name){return !!widgetState(name).on;}
  function setWidgetVisible(name,on){var st = widgetState(name); st.on = !!on; if(st.on)st.z = ++S.widgetZ; clampWidgetModel(name);}
  function bringWidgetFront(name){var st = widgetState(name); if(S.widgetZ < S.z)S.widgetZ = S.z; st.z = ++S.widgetZ; S.z = S.widgetZ;}
  function clampWidgetModel(name, el){
    var st = widgetState(name), def = WIDGET_DEFAULTS[name] || {}, pad = window.innerWidth < 768 ? 10 : 18;
    var w = el ? el.offsetWidth : (window.innerWidth < 768 ? Math.min(window.innerWidth - 20, def.w || 360) : (def.w || 360));

    var maxX = Math.max(pad, window.innerWidth - w - pad);
    var maxY = Math.max(pad, window.innerHeight - dockReserveHeight() - h - pad);
    st.x = clamp(st.x, pad, maxX);
    st.y = clamp(st.y, pad, maxY);
  }

  function getWindow(id){return S.windows.find(function(w){return w.id===id;});}

    var app = APPS[id], vw = window.innerWidth, vh = window.innerHeight, mobile = vw < 768;
    var width = app.size.width, height = app.size.height;
    var taskbarHeight = mobile ? 132 : 120, topMargin = mobile ? 8 : 20, safeHeight = Math.max(240, vh - taskbarHeight - topMargin);
    if(height > safeHeight)height = safeHeight;
    var x = app.pos.x, y = app.pos.y;
    if(id === "NOTIFICATION" && !mobile){x = (vw - width) / 2; y = (safeHeight - height) / 2 + topMargin;}

    else{x = (vw - width) / 2 + S.windows.length * 30; y = (safeHeight - height) / 2 + topMargin + S.windows.length * 30; if(x + width > vw)x = vw - width - 20; if(y + height > vh - taskbarHeight)y = vh - taskbarHeight - height - 10; x = Math.max(0,x); y = Math.max(topMargin,y);}

  function closeWindow(id){

  function minimizeWindow(id){

  function focusWindow(id, rerender){

  function toggleMaximize(id, rerender){

    else{w.restore = {x:w.x,y:w.y,width:w.width,height:w.height}; w.x = 0; w.y = 0; w.width = window.innerWidth; w.height = window.innerHeight; w.isMaximized = true;}

    if(rerender)renderDesktop();
  }
  function clamp(v,min,max){return Math.max(min, Math.min(max, v));}
  function dockReserveHeight(){
    if(S.taskCollapsed)return window.innerWidth < 768 ? 88 : 100;

  }
  function minWindowSize(){
    return {w: window.innerWidth < 768 ? 280 : 340, h: window.innerWidth < 768 ? 220 : 240};

  function clampWindow(w){

    var maxH = Math.max(min.h, window.innerHeight - dockReserveHeight() - margin);
    w.width = clamp(w.width, min.w, maxW);
    w.height = clamp(w.height, min.h, maxH);
    w.x = clamp(w.x, margin, Math.max(margin, window.innerWidth - w.width - margin));
    w.y = clamp(w.y, margin, Math.max(margin, window.innerHeight - dockReserveHeight() - w.height));
  }
  function applyWindowRect(el,w){
    if(!el || !w)return;
    el.style.left = w.x + "px";
    el.style.top = w.y + "px";
    el.style.width = w.width + "px";
    el.style.height = w.height + "px";

  function startWindowDrag(e){
    if(e.target.closest("button"))return;
    var id = e.currentTarget.getAttribute("data-drag"), w = getWindow(id);
    if(!w || w.isMaximized)return;

    if(e.currentTarget.setPointerCapture && e.pointerId != null){try{e.currentTarget.setPointerCapture(e.pointerId);}catch(err){}}

    function move(ev){w.x = ox + ev.clientX - sx; w.y = oy + ev.clientY - sy; clampWindow(w); applyWindowRect(el,w);}
    function up(){document.removeEventListener("pointermove",move); document.removeEventListener("pointerup",up); document.body.style.cursor = "default"; if(el)el.style.transition = ""; renderDesktop();}

  }
  function startResize(e){
    e.preventDefault(); e.stopPropagation();
    var parts = e.currentTarget.getAttribute("data-resize").split(":"), id = parts[0], dir = parts[1], w = getWindow(id);
    if(!w)return;

  function bindTaskbarDrag(){
    var task = document.getElementById("taskbar");
    if(!task)return;
    task.onpointerdown = function(e){
      if(e.target.closest("button") || e.target.closest("a") || e.target.closest(".dock-tray-panel"))return;
      e.preventDefault();

  function clampTaskbarPosition(){
    var mobile = window.innerWidth < 768, collapsed = S.taskCollapsed;
    if(mobile){
      var dockW = collapsed ? 86 : Math.max(0, window.innerWidth - 16);
      var minX = 8 - 8, maxX = Math.max(0, window.innerWidth - dockW - 8);

  function updateClock(){

  function runCommand(value){
    var t = TERMINAL_TEXT[S.language], raw = String(value || ""), args = raw.trim().split(/\s+/), cmd = (args[0] || "").toLowerCase(), response = t.notFound + ": " + cmd;
    if(cmd === "help")response = t.help;

    else if(cmd === "whoami")response = "root@cyberdeck-mainframe";
    else if(cmd === "date")response = new Date().toString();

    else if(cmd === "hack")response = t.access;

  function sendChat(value){

function webampCanFetchLocalSkins(){return location.protocol !== "file:";}
  function webampSkinUrl(file){return "skins/" + String(file || "spyamppro.wsz").split("/").map(encodeURIComponent).join("/");}
  function disposeWebamp(){
    webampMountToken++;
    if(webampInstance && typeof webampInstance.dispose === "function"){
      try{webampInstance.dispose();}catch(e){}
    }
    webampInstance = null;
  }
  function ensureWebamp(){
    var target = document.getElementById("webampTarget");
    if(!target){disposeWebamp(); return;}
    var status = document.getElementById("webampStatus"), token = ++webampMountToken;
    if(status){status.textContent = webampCanFetchLocalSkins() ? "LOADING WEBAMP CORE..." : "LOADING WEBAMP CORE // FILE PREVIEW USES DEFAULT SKIN"; status.classList.remove("is-hidden");}
    if(webampInstance && typeof webampInstance.dispose === "function"){
      try{webampInstance.dispose();}catch(e){}
    }
    webampInstance = null;
    if(!webampModulePromise)webampModulePromise = import("https://unpkg.com/webamp@^2");
    webampModulePromise.then(function(mod){
      if(token !== webampMountToken || !document.getElementById("webampTarget"))return;
      var Webamp = mod.default || mod.Webamp || mod;
      if(Webamp.browserIsSupported && !Webamp.browserIsSupported()){
        if(status)status.textContent = "WEBAMP NOT SUPPORTED";
        return;
      }
      var skin = (S.webamp && S.webamp.skin) || "spyamppro.wsz";
      var options = {initialTracks:[]};
      if(webampCanFetchLocalSkins()){
        options.initialSkin = {url:webampSkinUrl(skin)};
      }
      webampInstance = new Webamp(options);
      return webampInstance.renderWhenReady(document.getElementById("webampTarget")).then(function(){
        if(status)status.classList.add("is-hidden");
      });
    }).catch(function(err){
      if(status)status.textContent = "WEBAMP LOAD FAILED: " + (err && err.message ? err.message : "UNKNOWN");
    });
  }
  
function syncVercount(){
    var pv = document.getElementById("vercount_value_site_pv"), uv = document.getElementById("vercount_value_site_uv");
    if(!pv && !uv)return;
    setCounterDigits(pv, vercountCache.pv || "00126339", 8);
    setCounterDigits(uv, vercountCache.uv || "0042", 4);
    if(syncVercount.observer)syncVercount.observer.disconnect();
    if(window.MutationObserver){
      syncVercount.observer = new MutationObserver(function(){
        var pvNow = document.getElementById("vercount_value_site_pv"), uvNow = document.getElementById("vercount_value_site_uv");
        if(pvNow){var pvText = (pvNow.textContent || "").replace(/\D/g,""); if(pvText){vercountCache.pv = pvText; setCounterDigits(pvNow,pvText,8);}}
        if(uvNow){var uvText = (uvNow.textContent || "").replace(/\D/g,""); if(uvText){vercountCache.uv = uvText; setCounterDigits(uvNow,uvText,4);}}
      });
      if(pv)syncVercount.observer.observe(pv,{childList:true,subtree:true,characterData:true});
      if(uv)syncVercount.observer.observe(uv,{childList:true,subtree:true,characterData:true});
    }
    if(!syncVercount.loaded && webampCanFetchLocalSkins()){
      syncVercount.loaded = true;
      var sc = document.createElement("script");
      sc.defer = true;
      sc.src = "https://events.vercount.one/js";
      sc.onerror = function(){syncVercount.loaded = false; setCounterDigits(document.getElementById("vercount_value_site_pv"), vercountCache.pv, 8); setCounterDigits(document.getElementById("vercount_value_site_uv"), vercountCache.uv, 4);};
      document.head.appendChild(sc);
    }
  }
  
function selectProject(id){
    S.portfolio.selected = id;
    S.portfolio.media = 0;
    renderDesktop();
  }
  function currentProjectIndex(){
    return PROJECTS.findIndex(function(p){return p.id === S.portfolio.selected;});
  }
  function changeProject(dir){
    var idx = currentProjectIndex();
    if(idx < 0)return;
    var next = PROJECTS[(idx + dir + PROJECTS.length) % PROJECTS.length];
    S.portfolio.selected = next.id;
    S.portfolio.media = 0;
    renderDesktop();
  }
  function changeMedia(dir){
    var p = PROJECTS.find(function(x){return x.id === S.portfolio.selected;});
    if(!p)return;
    S.portfolio.media = (S.portfolio.media + dir + p.gallery.length) % p.gallery.length;
    if(!updatePortfolioMediaDom())renderDesktop();
  }
  window.addEventListener("keydown", function(e){

    if(e.key === "ArrowLeft"){e.preventDefault(); changeMedia(-1);}
    if(e.key === "ArrowRight"){e.preventDefault(); changeMedia(1);}

  });
  window.addEventListener("resize", function(){

      if(!S.logged)return;

        if(w.isMaximized){
          w.x = 0; w.y = 0; w.width = window.innerWidth; w.height = window.innerHeight;

        }else{
          var before = [w.x,w.y,w.width,w.height].join(":");
          clampWindow(w);
          if(before !== [w.x,w.y,w.width,w.height].join(":"))changed = true;
        }
      });
      if(changed)renderDesktop();
    },80);
  });
  initDomCrtShell();
  initCrtPortalObserver();
  boot();
})();
