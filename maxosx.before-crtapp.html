    const ctx=c.getContext("2d");ctx.fillStyle="rgb(255,255,255)";ctx.fillRect(0,0,period,period);
    const lineValue=Math.round(255*(1-Math.min(1,domCrtState.maskOpacity)));
    ctx.fillStyle="rgb("+lineValue+","+lineValue+","+lineValue+")";
    const maskX=Math.max(0,Math.min(period,Math.round(domCrtState.maskX)));
    const maskY=Math.max(0,Math.min(period,Math.round(domCrtState.maskY)));
    if(maskX>0)ctx.fillRect(0,0,maskX,period);
    if(maskY>0)ctx.fillRect(0,0,period,maskY);
    return c.toDataURL("image/png");
  }
  function updatePhosphorTiles(){
    const period=Math.max(3,Math.round(domCrtState.rgbPeriod));
    setSvgHref(svgEls.rgbTile,makeRgbTileDataUrl());
    svgEls.rgbTile.setAttribute("width",String(period));svgEls.rgbTile.setAttribute("height",String(period));
    setSvgHref(svgEls.maskTile,makeMaskTileDataUrl());
    svgEls.maskTile.setAttribute("width",String(period));svgEls.maskTile.setAttribute("height",String(period));
  }
  function updateRgbMixAlgorithm(){
    const o=Math.max(0,Math.min(1,domCrtState.rgbOpacity));
    if(domCrtState.rgbBlend==="screen"){svgEls.rgbMixNode.setAttribute("k1",String(-o));svgEls.rgbMixNode.setAttribute("k2","1");svgEls.rgbMixNode.setAttribute("k3",String(o));svgEls.rgbMixNode.setAttribute("k4","0");}
    else if(domCrtState.rgbBlend==="normal"){svgEls.rgbMixNode.setAttribute("k1","0");svgEls.rgbMixNode.setAttribute("k2",String(1-o));svgEls.rgbMixNode.setAttribute("k3",String(o));svgEls.rgbMixNode.setAttribute("k4","0");}
    else if(domCrtState.rgbBlend==="color-dodge"){svgEls.rgbMixNode.setAttribute("k1",String(-o*1.35));svgEls.rgbMixNode.setAttribute("k2","1");svgEls.rgbMixNode.setAttribute("k3",String(o*1.55));svgEls.rgbMixNode.setAttribute("k4","0");}
    else if(domCrtState.rgbBlend==="lighten"){svgEls.rgbMixNode.setAttribute("k1","0");svgEls.rgbMixNode.setAttribute("k2","1");svgEls.rgbMixNode.setAttribute("k3",String(o*.55));svgEls.rgbMixNode.setAttribute("k4","0");}
    else{svgEls.rgbMixNode.setAttribute("k1","0");svgEls.rgbMixNode.setAttribute("k2","1");svgEls.rgbMixNode.setAttribute("k3",String(o));svgEls.rgbMixNode.setAttribute("k4","0");}
    const boost=2.15+o*2.45;
    svgEls.rgbBoostR.setAttribute("slope",String(boost));svgEls.rgbBoostG.setAttribute("slope",String(boost));svgEls.rgbBoostB.setAttribute("slope",String(boost));
  }
  function updateGlowAlgorithm(){
    const modeScale=domCrtState.glowMode==="fast"?.42:domCrtState.glowMode==="quality"?.90:domCrtState.glowMode==="off"?0:domCrtState.glowQuality;
    const o=domCrtState.glowMode==="off"?0:Math.max(0,Math.min(1,domCrtState.glowOpacity));
    svgEls.pipelineGlowBlurNode.setAttribute("stdDeviation",Math.max(0,domCrtState.glowBlurX*modeScale)+" "+Math.max(0,domCrtState.glowBlurY*modeScale));
    const gain=1+o*1.05;
    svgEls.glowGainR.setAttribute("slope",String(gain));svgEls.glowGainG.setAttribute("slope",String(gain));svgEls.glowGainB.setAttribute("slope",String(gain));
    if(domCrtState.glowBlend==="plus-lighter"){svgEls.glowMixNode.setAttribute("k1","0");svgEls.glowMixNode.setAttribute("k2","1");svgEls.glowMixNode.setAttribute("k3",String(o));svgEls.glowMixNode.setAttribute("k4","0");}
    else if(domCrtState.glowBlend==="color-dodge"){svgEls.glowMixNode.setAttribute("k1",String(-o*1.18));svgEls.glowMixNode.setAttribute("k2","1");svgEls.glowMixNode.setAttribute("k3",String(o*1.32));svgEls.glowMixNode.setAttribute("k4","0");}
    else if(domCrtState.glowBlend==="normal"){svgEls.glowMixNode.setAttribute("k1","0");svgEls.glowMixNode.setAttribute("k2",String(1-o));svgEls.glowMixNode.setAttribute("k3",String(o));svgEls.glowMixNode.setAttribute("k4","0");}
    else if(domCrtState.glowBlend==="lighten"){svgEls.glowMixNode.setAttribute("k1","0");svgEls.glowMixNode.setAttribute("k2","1");svgEls.glowMixNode.setAttribute("k3",String(o*.48));svgEls.glowMixNode.setAttribute("k4","0");}
    else{svgEls.glowMixNode.setAttribute("k1",String(-o));svgEls.glowMixNode.setAttribute("k2","1");svgEls.glowMixNode.setAttribute("k3",String(o));svgEls.glowMixNode.setAttribute("k4","0");}
  }
  function applyDomCrtState(options={}){
    regenerateWarpMap(options.forceMap===true);
    svgEls.postWarpBlurNode.setAttribute("stdDeviation",domCrtState.postBlurX+" "+domCrtState.postBlurY);
    svgEls.pipelineRgbBlurNode.setAttribute("stdDeviation",domCrtState.rgbBlurX+" "+domCrtState.rgbBlurY);
    svgEls.pipelineMaskBlurNode.setAttribute("stdDeviation",domCrtState.maskBlurX+" "+domCrtState.maskBlurY);
    updatePhosphorTiles();updateRgbMixAlgorithm();updateGlowAlgorithm();
    setCssVar("--brightness",domCrtState.brightness);setCssVar("--contrast",domCrtState.contrast);setCssVar("--saturation",domCrtState.saturation);
    setCssVar("--flicker-amount",domCrtState.flickerAmount);setCssVar("--flicker-duration",Math.max(.033,1/Math.max(.2,domCrtState.flickerSpeed)),"s");
    setCssVar("--rgb-opacity",domCrtState.rgbOpacity);setCssVar("--rgb-blend",domCrtState.rgbBlend);setCssVar("--mask-opacity",domCrtState.maskOpacity);
    setCssVar("--beam-blend",domCrtState.beamBlend);setCssVar("--beam-opacity",domCrtState.beamOpacity);setCssVar("--beam-height",domCrtState.beamHeight,"px");setCssVar("--beam-speed",domCrtState.beamSpeed,"s");
    setCssVar("--glow-opacity",domCrtState.glowOpacity);setCssVar("--vignette-opacity",domCrtState.vignetteOpacity);setCssVar("--vignette-inner",domCrtState.vignetteInner,"%");setCssVar("--vignette-outer",domCrtState.vignetteOuter,"%");
  }
  window.maxosxCrt={state:domCrtState,defaults:DOM_CRT_DEFAULT,apply:(force=true)=>applyDomCrtState({forceMap:force})};
  applyDomCrtState({forceMap:true});
  window.addEventListener("resize",()=>{clearTimeout(domCrtResizeTimer);domCrtResizeTimer=setTimeout(()=>applyDomCrtState({forceMap:true}),80);});
}

let resizeTimer=null;
window.addEventListener('resize',()=>{if(!state.booted)return;clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{clampAllWindows();render();},90);});
window.addEventListener('keydown',e=>{if(!state.booted)return;const tag=(e.target&&e.target.tagName||'').toLowerCase();const typing=tag==='input'||tag==='textarea'||tag==='select'||e.target?.isContentEditable;if((e.key==='Escape'&&e.ctrlKey)||(e.key==='Meta')){e.preventDefault();state.start=!state.start;render();return;}if(e.key==='Escape'&&state.start){state.start=false;render();return;}if(typing)return;if(e.key==='Escape'&&state.active){state.active=null;render();return;}if(e.key==='F4'&&e.altKey){e.preventDefault();if(state.active==='webamp'){closeWebamp();return;}if(state.active)closeWindow(state.active);return;}if(e.key==='Tab'&&e.altKey){e.preventDefault();const visible=state.windows.filter(w=>!w.minimized).sort((a,b)=>b.z-a.z);if(visible.length){const current=visible.findIndex(w=>w.id===state.active);const next=visible[(current+1)%visible.length]||visible[0];focusWindow(next.id);render();}}});
window.addEventListener('message',e=>{
  if(!e.data||typeof e.data!=='object')return;
  if(e.data.type==='maxosx-webamp-close')closeWebamp();
  if(e.data.type==='maxosx-webamp-skin'&&skinFiles.includes(e.data.skin))state.selectedSkin=e.data.skin;
});

initDomCrtShell();
render();
</script>
